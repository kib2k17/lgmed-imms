# Tests, deployment checks and a dependency audit on every push and pull
# request to main. Uses throw-away credentials for a throw-away MySQL - no
# real secret belongs in this file or in the repository's Actions secrets.

name: Tests and security checks

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-root-password
          MYSQL_DATABASE: lgmedimms
        ports: [ "3306:3306" ]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-only-root-password"
          --health-interval=10s --health-timeout=5s --health-retries=10

    env:
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret-key-0123456789-abcdefghijklmnopqrstuvwxyz
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      MYSQL_USER: root
      MYSQL_PASSWORD: ci-only-root-password
      MYSQL_HOST: 127.0.0.1

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: "3.14"

    - name: Install system libraries for mysqlclient
      run: sudo apt-get update && sudo apt-get install -y pkg-config default-libmysqlclient-dev

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Django system checks
      run: python manage.py check

    - name: Deployment checks (production settings)
      env:
        DJANGO_DEBUG: "0"
        DJANGO_ALLOWED_HOSTS: lgmed-imms.example.gov.ph
        DJANGO_BEHIND_TLS_PROXY: "1"
      run: python manage.py check --deploy --fail-level ERROR

    - name: Missing migrations
      run: python manage.py makemigrations --check --dry-run

    - name: Test suite
      run: python manage.py test --noinput

    - name: Dependency vulnerability audit
      run: |
        pip install pip-audit
        pip-audit -r requirements.txt
