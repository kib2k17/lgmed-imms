# Builds the Android app in mobile/ into an installable APK on GitHub's
# machines, so no computer in the office needs Android Studio. The APK is
# attached to each run: Actions tab -> "Build APK" -> the run -> Artifacts.
#
# Runs when mobile/ changes on main, or by hand from the Actions tab
# ("Run workflow"). The website itself is not part of the APK - see
# mobile/README.md.

name: Build APK

on:
  push:
    branches: [ "main" ]
    paths: [ "mobile/**", ".github/workflows/build-apk.yml" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "17"

    # The project carries no Gradle wrapper (it would mean committing a binary
    # jar); this installs the Gradle version the Android plugin needs.
    - uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: "8.9"

    - name: Build APK
      run: gradle assembleDebug --no-daemon

    - uses: actions/upload-artifact@v4
      with:
        name: lgmed-imms-apk
        path: mobile/app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
