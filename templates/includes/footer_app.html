{% comment %}
 Compact footer for the authenticated system. The full government footer
   lives on the public website (includes/footer.html). 
{% endcomment %}
<footer class="mt-auto border-t border-slate-200 bg-white px-4 py-4 sm:px-6 lg:px-8 no-print">
  <div class="mx-auto flex w-full max-w-[100rem] flex-wrap items-center justify-between gap-x-6 gap-y-2 text-meta text-slate-500">
    <p>
      <span class="font-semibold text-slate-700">{{ agency.system_name }}</span>
      &mdash; {{ agency.division }},
      {{ agency.office_short }}
    </p>
    <ul class="flex flex-wrap items-center gap-x-4 gap-y-1">
      <li><a href="{% url 'core:public_contact' %}" class="hover:text-brand-700 hover:underline">Contact</a></li>
      <li><a href="{% url 'core:home' %}" class="hover:text-brand-700 hover:underline">Public website</a></li>
      <li><a href="{% url 'core:components' %}" class="hover:text-brand-700 hover:underline">Design system</a></li>
    </ul>
  </div>
</footer>
