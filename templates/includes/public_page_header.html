{% load ui %}
{# Page banner and breadcrumb for public interior pages. #}
<div class="border-b border-slate-200 bg-slate-50">
  <div class="mx-auto max-w-7xl px-4 py-8 sm:px-6 lg:px-8">
    <nav aria-label="Breadcrumb">
      <ol class="flex flex-wrap items-center gap-x-1.5 gap-y-1 text-meta text-slate-500">
        <li><a href="{% url 'core:home' %}" class="hover:text-brand-700 hover:underline">Home</a></li>
        <li class="flex items-center gap-1.5">
          <span class="text-slate-300" aria-hidden="true">{% icon "chevron-right" "size-3.5" %}</span>
          <span class="font-medium text-slate-700" aria-current="page">{{ page_title }}</span>
        </li>
      </ol>
    </nav>
    <h1 class="mt-3 text-page-title font-bold tracking-tight text-slate-900">{{ page_title }}</h1>
    {% if page_subtitle %}
      <p class="mt-1.5 max-w-3xl text-[0.9375rem] text-slate-600">{{ page_subtitle }}</p>
    {% endif %}
  </div>
</div>
