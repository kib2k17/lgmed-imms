# /etc/nginx/snippets/lgmed-imms-proxy.conf - included by lgmed-imms.conf.
proxy_pass http://lgmed_imms;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
# Overwritten, never passed through: a client cannot claim HTTPS.
proxy_set_header X-Forwarded-Proto $scheme;
# Appended: Django trusts only the last entry (the address nginx saw).
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Real-IP $remote_addr;
proxy_connect_timeout 10s;
proxy_send_timeout 120s;
# proxy_read_timeout is set per server in lgmed-imms.conf, not here: /ws/ needs
# a longer one, and nginx refuses a directive given twice in one location.
proxy_redirect off;
