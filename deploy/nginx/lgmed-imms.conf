# LGMED-IMMS - nginx reverse proxy (TEMPLATE)
#
# Replace lgmed-imms.example.gov.ph, the certificate paths and /srv/lgmed-imms
# with the real values. Test with `nginx -t` before reloading.
#
# What this file guarantees, and why:
#   * HTTPS only; plain HTTP is redirected.
#   * X-Forwarded-Proto is OVERWRITTEN (never passed through from the client),
#     which is what makes DJANGO_BEHIND_TLS_PROXY=1 safe.
#   * X-Forwarded-For has the real peer APPENDED, which is what makes
#     DJANGO_TRUST_X_FORWARDED_FOR=1 safe (Django reads the last entry).
#   * /static/ is served from disk; /media/ is deliberately NOT - every file
#     request goes to Django, which checks who may read it (core/media.py).
#   * Request bodies are capped; the sign-in page is rate limited here too.

limit_req_zone $binary_remote_addr zone=lgmed_login:10m rate=10r/m;

upstream lgmed_imms {
    server 127.0.0.1:8001;           # Daphne (deploy/systemd/lgmed-imms.service)
    keepalive 16;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name lgmed-imms.example.gov.ph;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name lgmed-imms.example.gov.ph;

    ssl_certificate     /etc/ssl/lgmed-imms/fullchain.pem;
    ssl_certificate_key /etc/ssl/lgmed-imms/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:LGMEDSSL:10m;
    ssl_session_tickets off;

    server_tokens off;

    # Largest single request: e-SIRA and PPA uploads are capped at 25 MB per
    # file by the application; a batch of photographs can be several files.
    client_max_body_size 100m;
    client_body_timeout 60s;
    keepalive_timeout 30s;

    # Django sets the security headers (CSP, HSTS, X-Frame-Options, ...).
    # Do not add duplicates here: two CSP headers are combined by the browser
    # into the stricter of both and can break pages unexpectedly.

    location /static/ {
        alias /srv/lgmed-imms/app/staticfiles/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
    }

    # Never `alias` /media/ - see the header comment.

    location = /accounts/login/ {
        limit_req zone=lgmed_login burst=10 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/lgmed-imms-proxy.conf;
    }

    # The Django admin bypasses some workflow rules. Optionally restrict it
    # to the office network or the administrators' workstations:
    # location /django-admin/ {
    #     allow 10.0.0.0/8;
    #     deny all;
    #     include /etc/nginx/snippets/lgmed-imms-proxy.conf;
    # }

    location /ws/ {
        include /etc/nginx/snippets/lgmed-imms-proxy.conf;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
    }

    location / {
        include /etc/nginx/snippets/lgmed-imms-proxy.conf;
    }
}
